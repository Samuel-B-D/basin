; The NormalSize variant. %COLOR% is the color scheme's image directory.

[SysMetrics]
CaptionFont = Basin Test Sans, 9, bold
SmallCaptionFont = Basin Test Sans, 8, bold
SizingBorderWidth = 1
CaptionBarWidth = 20
CaptionBarHeight = 19
SMCaptionBarWidth = 13
SMCaptionBarHeight = 13
ActiveCaption = 0 64 192
InactiveCaption = 112 136 200
CaptionText = 255 255 255
InactiveCaptionText = 216 224 240
FlatMenus = True

[globals]
TextColor = 1 2 3
GlowColor = 9 9 9

[Window]
BgType = ImageFile
Transparent = true
TextShadowOffset = 1, 1
TextShadowColor = 0 0 64

[Window.Caption]
ImageFile = %COLOR%\Caption.bmp
SizingMargins = 8, 8, 6, 4
ContentMargins = 1, 1, 1, 1
CaptionMargins = 4, 3, 0, 0
SizingType = stretch
ImageLayout = vertical
ImageCount = 2
Transparent = True
SizingType = Tile        ; the first SizingType wins, as in uxtheme

[Window.Caption(Active)]
TextShadowType = Single

[Window.SmallCaption]
ImageFile = %COLOR%\SmallCaption.bmp
SizingMargins = 8, 8, 6, 4
CaptionMargins = 3, 2, 0, 0
SizingType = stretch
ImageLayout = vertical
ImageCount = 2
Transparent = True

[Window.MaxCaption]
ImageFile = %COLOR%\MaxCaption.bmp
SizingMargins = 8, 8, 6, 4
CaptionMargins = 4, 3, 4, 2
SizingType = stretch
ImageLayout = vertical
ImageCount = 2
ContentAlignment = left

[Window.MaxCaption(Active)]
TextShadowType = Single

[Window.FrameLeft]
ImageFile = %COLOR%\FrameLeft.bmp
SizingMargins = 0, 0, 2, 2
SizingType = stretch
ImageLayout = vertical
ImageCount = 2

[Window.FrameRight]
ImageFile = %COLOR%\FrameRight.bmp
SizingMargins = 0, 0, 2, 2
SizingType = stretch
ImageLayout = vertical
ImageCount = 2

[Window.FrameBottom]
ImageFile = %COLOR%\FrameBottom.bmp
SizingMargins = 4, 4, 0, 0
SizingType = stretch
ImageLayout = vertical
ImageCount = 2

[Window.SmallFrameLeft]
ImageFile = %COLOR%\SmallFrameLeft.bmp
SizingMargins = 0, 0, 2, 2
SizingType = stretch
ImageLayout = vertical
ImageCount = 2

[Window.SmallFrameRight]
ImageFile = %COLOR%\SmallFrameRight.bmp
SizingMargins = 0, 0, 2, 2
SizingType = stretch
ImageLayout = vertical
ImageCount = 2

[Window.SmallFrameBottom]
ImageFile = %COLOR%\SmallFrameBottom.bmp
SizingMargins = 4, 4, 0, 0
SizingType = stretch
ImageLayout = vertical
ImageCount = 2

[Window.SysButton]
OffsetType = TopLeft
Offset = 4, 4

[Window.CloseButton]
BgType = ImageFile
ImageFile = %COLOR%\CloseButton.bmp
SizingMargins = 3, 3, 3, 3
ContentMargins = 2, 2, 2, 2
SizingType = Stretch
ImageCount = 8
ImageLayout = Vertical
OffsetType = TopRight
Offset = -20, 4
GlyphType = ImageGlyph
GlyphTransparent = True
ImageSelectType = Dpi
ImageFile1 = %COLOR%\CloseGlyph.bmp
ImageFile2 = %COLOR%\CloseGlyph16.bmp
MinDpi1 = 96
MinDpi2 = 192

[Window.MaxButton]
BgType = ImageFile
ImageFile = %COLOR%\CaptionButton.bmp
SizingMargins = 3, 3, 3, 3
ContentMargins = 2, 2, 2, 2
SizingType = Stretch
ImageCount = 8
ImageLayout = Vertical
OffsetType = TopRight
Offset = -38, 4
GlyphType = ImageGlyph
GlyphTransparent = True
ImageSelectType = Dpi
ImageFile1 = %COLOR%\MaximizeGlyph.bmp
ImageFile2 = %COLOR%\MaximizeGlyph16.bmp
MinDpi1 = 96
MinDpi2 = 192

[Window.RestoreButton]
BgType = ImageFile
ImageFile = %COLOR%\CaptionButton.bmp
SizingMargins = 3, 3, 3, 3
ContentMargins = 2, 2, 2, 2
SizingType = Stretch
ImageCount = 8
ImageLayout = Vertical
OffsetType = TopRight
Offset = -38, 4
GlyphType = ImageGlyph
GlyphTransparent = True
ImageSelectType = Dpi
ImageFile1 = %COLOR%\RestoreGlyph.bmp
ImageFile2 = %COLOR%\RestoreGlyph16.bmp
MinDpi1 = 96
MinDpi2 = 192

[Window.MinButton]
BgType = ImageFile
ImageFile = %COLOR%\CaptionButton.bmp
SizingMargins = 3, 3, 3, 3
ContentMargins = 2, 2, 2, 2
SizingType = Stretch
ImageCount = 8
ImageLayout = Vertical
OffsetType = TopRight
Offset = -56, 4
GlyphType = ImageGlyph
GlyphTransparent = True
ImageSelectType = Dpi
ImageFile1 = %COLOR%\MinimizeGlyph.bmp
ImageFile2 = %COLOR%\MinimizeGlyph16.bmp
MinDpi1 = 96
MinDpi2 = 192

[Window.HelpButton]
BgType = ImageFile
ImageFile = %COLOR%\CaptionButton.bmp
SizingMargins = 3, 3, 3, 3
ContentMargins = 2, 2, 2, 2
SizingType = Stretch
ImageCount = 8
ImageLayout = Vertical
OffsetType = TopRight
Offset = -56, 4
GlyphType = ImageGlyph
GlyphTransparent = True
ImageSelectType = Dpi
ImageFile1 = %COLOR%\HelpGlyph.bmp
ImageFile2 = %COLOR%\HelpGlyph16.bmp
MinDpi1 = 96
MinDpi2 = 192

[Window.SmallCloseButton]
BgType = ImageFile
ImageFile = %COLOR%\SmallCloseButton.bmp
SizingMargins = 3, 3, 3, 3
SizingType = Stretch
ImageCount = 8
ImageLayout = Vertical
OffsetType = TopRight
Offset = -15, 3
GlyphType = ImageGlyph
GlyphImageFile = %COLOR%\SmallCloseGlyph.bmp
GlyphTransparent = True

[Window.Dialog]
BgType = BorderFill
FillColor = 236 233 216
BorderColor = 236 233 216

[Test::Window.Caption]
ContentMargins = 7, 7, 7, 7
