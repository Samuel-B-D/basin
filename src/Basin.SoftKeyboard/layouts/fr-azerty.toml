id = "fr-azerty"
name = "FR AZERTY"
language = "fr"
width_units = 11.5
num_lock = true
symbol_label = "+ = [  ]"

rows = [
    [
        { w = -0.5, plain = "&", alt = "1" },
        { w = 1, plain = "&", alt = "1", long = ["1", "&", "¹", "¼", "½"] },
        { w = 1, plain = "é", alt = "2", long = ["2", "é", "²"] },
        { w = 1, plain = "\"", alt = "3", long = ["3", "\"", "³", "¾", "“", "”", "«", "»"] },
        { w = 1, plain = "'", alt = "4", long = ["4", "'", "‘", "’"] },
        { w = 1, plain = "(", alt = "5", long = ["5", "(", "[", "{"] },
        { w = 1, plain = "-", alt = "6", long = ["6", "-", "±", "¬"] },
        { w = 1, plain = "è", alt = "7", long = ["7", "è", "`"] },
        { w = 1, plain = ")", alt = "8", long = ["8", ")", "]", "}"] },
        { w = 1, plain = "ç", alt = "9", long = ["9", "ç", "¢", "$", "€", "£", "¥", "¤"] },
        { w = 1, plain = "à", alt = "0", long = ["0", "à", "%", "‰"] },
        { w = -1, plain = "{backspace}" },
    ],
    [
        { w = 1, plain = "a", alt = "~", long = ["a", "à", "á", "â", "ã", "ä", "å", "æ", "ª"] },
        { w = 1, plain = "z", alt = "#", long = ["z", "ž", "ź", "ż"] },
        { w = 1, plain = "e", alt = "€", long = ["e", "è", "é", "ê", "ë", "ę", "ē"] },
        { w = 1, plain = "r", alt = "$", long = ["r", "®"] },
        { w = 1, plain = "t", alt = "\\", long = ["t", "™", "þ"] },
        { w = 1, plain = "y", alt = "|", long = ["y", "ý", "ÿ"] },
        { w = 1, plain = "u", alt = "{", long = ["u", "ù", "ú", "û", "ü", "ű"] },
        { w = 1, plain = "i", alt = "}", long = ["i", "ì", "í", "î", "ï", "İ", "ı"] },
        { w = 1, plain = "o", alt = "[", long = ["o", "ò", "ó", "ô", "õ", "ö", "ø", "ő", "œ", "º", "ω"] },
        { w = 1, plain = "p", alt = "]", long = ["p", "§", "π"] },
        { w = 1.5, plain = "{backspace}" },
    ],
    [
        { w = -0.5, plain = "q", alt = "<" },
        { w = 1, plain = "q", alt = "<" },
        { w = 1, plain = "s", alt = ">", long = ["s", "š", "ş", "ß", "σ"] },
        { w = 1, plain = "d", alt = "=", long = ["d", "ð", "†", "‡"] },
        { w = 1, plain = "f", alt = "+" },
        { w = 1, plain = "g", alt = "×", long = ["g", "ğ"] },
        { w = 1, plain = "h", alt = "÷" },
        { w = 1, plain = "j", alt = "%" },
        { w = 1, plain = "k", alt = "°" },
        { w = 1, plain = "l", alt = "¨", long = ["l", "ł"] },
        { w = 1, plain = "m", alt = "^", long = ["m", "µ"] },
        { w = 1, plain = "{return}" },
    ],
    [
        { w = 1, plain = "{shift}" },
        { w = 1, plain = "w", alt = ":-)" },
        { w = 1, plain = "x", alt = ";-)" },
        { w = 1, plain = "c", alt = ":-(", long = ["c", "ç", "ć", "©", "¢"] },
        { w = 1, plain = "v", alt = ":'(" },
        { w = 1, plain = "b", alt = ":-P" },
        { w = 1, plain = "n", alt = ":-O", long = ["n", "ñ", "ń"] },
        { w = 1, plain = ",", alt = "?", long = [",", "?", "¿"] },
        { w = 1, plain = ".", alt = ";", long = [".", ";", "•", "…"] },
        { w = 1, plain = ":", alt = "/", long = [":", "/", "\\"] },
        { w = 1.5, plain = "{shift}" },
    ],
]

dotcom = [".com", ".fr", ".net", ".org", ".edu"]

[bottom]
default = [
    { w = 1, plain = "{tab}" },
    { w = 2, plain = "{symbol}" },
    { w = 0 },
    { w = 0 },
    { w = 5, plain = " " },
    { w = 0 },
    { w = 1, plain = "@", alt = "_", long = ["@", "_"] },
    { w = 1, plain = "!", alt = "*", long = ["!", "*", "¡"] },
    { w = 1.5, plain = "{hide}", long = ["{size-xs}", "{size-s}", "{size-m}", "{size-l}"] },
]
email = [
    { w = 1, plain = "{tab}" },
    { w = 2, plain = "{symbol}" },
    { w = 0 },
    { w = 0 },
    { w = 4, plain = " " },
    { w = 1, plain = ".com", long = [".com", ".fr", ".net", ".org", ".edu"] },
    { w = 1, plain = "@", alt = "_", long = ["@", "_"] },
    { w = 1, plain = "!", alt = "*", long = ["!", "*", "¡"] },
    { w = 1.5, plain = "{hide}", long = ["{size-xs}", "{size-s}", "{size-m}", "{size-l}"] },
]
url = [
    { w = 1, plain = "{tab}" },
    { w = 2, plain = "{symbol}" },
    { w = 0 },
    { w = 1, plain = "/" },
    { w = 3, plain = " " },
    { w = 1, plain = ".com", long = [".com", ".fr", ".net", ".org", ".edu"] },
    { w = 1, plain = "@", alt = "_", long = ["@", "_"] },
    { w = 1, plain = "!", alt = "*", long = ["!", "*", "¡"] },
    { w = 1.5, plain = "{hide}", long = ["{size-xs}", "{size-s}", "{size-m}", "{size-l}"] },
]
